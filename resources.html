<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    
    <title>Resources | Andrew Joung - Economics PhD Candidate</title>
    <meta name="description" content="Resources and tools for economics research, including Federal Statistical Research Data Centers map.">
    
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Page-specific styles for Resources */
        .resources-main {
            background: var(--color-bg-light);
            min-height: calc(100vh - 64px - 100px); /* Subtract nav and footer height */
        }
        
        .map-container {
            background: var(--color-bg);
            border-radius: 8px;
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .map-title {
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--color-text);
            margin-bottom: var(--spacing-md);
            text-align: center;
        }
        
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }
        
        .map-wrapper iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        
        .map-caption {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 0.9rem;
            margin-top: var(--spacing-md);
            font-style: italic;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .map-wrapper iframe {
                height: 400px;
            }
            
            .map-title {
                font-size: 1.25rem;
            }
            
            .map-container {
                padding: var(--spacing-md);
            }
        }
        
        @media (max-width: 480px) {
            .map-wrapper iframe {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="index.html" aria-label="Andrew Joung Home">Andrew Joung</a>
            </div>
            <button class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="research.html">Research</a>
                <a href="https://andrewjoung.com/JoungAndrew_CV.pdf">CV</a>
                <!-- Resources link will be added here later -->
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="resources-main">
        <section class="section section-first">
            <div class="container">
                <div class="map-container">
                    <h2 class="map-title">Map of Federal Statistical Research Data Centers</h2>
                    
                    <div class="map-wrapper">
                        <iframe 
                            src="https://www.google.com/maps/d/u/0/embed?mid=1ylWJtgicd4LNI7GBZpnYeBlA_FsBWpE&ehbc=2E312F" 
                            width="640" 
                            height="480"
                            loading="lazy"
                            allowfullscreen
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                    
                    <p class="map-caption">
                        I made this for my job market search, so I can more easily find the commute times to various RDCs. 
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- Minimal Footer -->
    <footer class="main-footer-minimal">
        <div class="container">
            <div class="footer-content-minimal">
                <p>&copy; 2025 Andrew Joung</p>
                <div class="footer-links-minimal">
                    <a href="https://www.linkedin.com/in/andrew-joung/">LinkedIn</a>
                    <a href="https://scholar.google.com/citations?user=AFNID-EAAAAJ&hl=en">Google Scholar</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
</body>
</html>
